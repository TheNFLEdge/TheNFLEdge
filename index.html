<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name='impact-site-verification' value='2b9a6ed2-369b-4f1f-a8a6-925b5825bc73'>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE NFL EDGE | PanaGeoTech Algorithmic NFL Projections</title>
    <style>
        :root {
            --nfl-navy: #00205B;
            --nfl-red: #BF0A30;
            --bg-dark: #050505;
            --sidebar-width: 80px;
            --header-height: 100px;
            --footer-height: 40px;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            overflow: hidden; /* Essential for the dashboard feel */
        }

        /* DASHBOARD LAYOUT */
        .dashboard-container {
            display: flex;
            height: 100vh;
        }

        /* SIDEBAR (NAV) */
        .sidebar {
            width: var(--sidebar-width);
            background-color: #000;
            border-right: 1px solid #222;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
            z-index: 100;
        }

        .helmet-logo {
            width: 60px;
            height: 60px;
            animation: spin 2.5s linear infinite; /* Keeps the helm spinning */
            cursor: pointer;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* MAIN CONTENT AREA */
        .main-pane {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* TOP HEADER */
        .top-header {
            height: var(--header-height);
            background: linear-gradient(90deg, #000 0%, var(--nfl-navy) 100%);
            border-bottom: 2px solid var(--nfl-red);
            display: flex;
            align-items: center;
            padding: 0 30px;
        }

        .nfl-banner {
            height: 60px;
        }

        /* IFRAME VIEWPORT */
        .projection-frame {
            flex-grow: 1;
            width: 100%;
            border: none;
            background-color: #000;
            /* Leaves room for the footer */
            margin-bottom: var(--footer-height);
        }

        /* FLOATING FOOTER */
        .floating-footer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: var(--footer-height);
            background-color: #000;
            border-top: 2px solid var(--nfl-red); /* Your signature divider */
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 110;
        }

        .footer-text {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #777;
        }

        .footer-text span {
            color: var(--nfl-red);
            font-weight: bold;
        }

        /* NAV BUTTONS */
        .nav-group { margin-top: 30px; display: flex; flex-direction: column; gap: 15px; }
        .nav-btn {
            color: #fff; text-decoration: none; font-size: 10px; font-weight: bold;
            padding: 8px 0; width: 60px; text-align: center; border: 1px solid #333;
            background: #111; transition: 0.3s;
        }
        .nav-btn:hover { background: var(--nfl-red); border-color: #fff; }

        /* PHONES / NARROW SCREENS: top nav bar, compact header, iframe fills the rest */
        @media (max-width: 700px) {
            :root { --footer-height: 28px; }
            .dashboard-container { flex-direction: column; height: 100vh; height: 100dvh; }
            .sidebar {
                width: 100%; height: 48px; flex-direction: row; align-items: center;
                padding: 0 10px; box-sizing: border-box; gap: 10px;
                border-right: none; border-bottom: 1px solid #222;
            }
            .helmet-logo { width: 34px; height: 34px; flex: none; }
            .nav-group { margin: 0; flex: 1; flex-direction: row; gap: 8px; }
            .nav-btn { flex: 1; width: auto; min-height: 36px; padding: 0; font-size: 13px; line-height: 36px; box-sizing: border-box; }
            .top-header { height: auto; padding: 6px 10px; justify-content: center; }
            .nfl-banner { height: auto; max-height: 40px; max-width: 100%; }
            .main-pane { min-height: 0; }
            .projection-frame { min-height: 0; -webkit-overflow-scrolling: touch; }
            .footer-text { font-size: 9px; letter-spacing: 1px; }
        }

    </style>
</head>
<body>

    <div class="dashboard-container">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <img src="images/Hat3.png" class="helmet-logo" alt="PanaGeo Logo">
            <div class="nav-group">
                <a href="nfle26-C00.htm" target="data_viewport" class="nav-btn">NFL</a>
                <a href="https://thenfledge.github.io/TheUFLEdge/" target="_blank" rel="noopener noreferrer" class="nav-btn">UFL</a>
                <a href="https://thenfledge.github.io/TheNFLEdge/archives/index.html" target="data_viewport" class="nav-btn">HISTORY</a>
            </div>
        </aside>

        <!-- MAIN VIEW -->
        <main class="main-pane">
            <header class="top-header">
                <img src="images/NFLBAN26.jpg" class="nfl-banner" alt="The NFL Edge">
            </header>

            <!-- THE-MAIN-FRAME -->
            <iframe src="nfle26-C00.htm" name="data_viewport" class="projection-frame"></iframe>

            <!-- FLOATING FOOTER -->
            <footer class="floating-footer">
                <div class="footer-text">
                    The NFL Edge : powered by <span>PanaGeoTech</span> (c) 2026
                </div>
            </footer>
        </main>
    </div>

</body>
</html>
