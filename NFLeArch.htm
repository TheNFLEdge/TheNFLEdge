<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=archives/index.html">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The NFL Edge Archives</title>
    <style>
        :root {
            --ink: #101820;
            --navy: #00205b;
            --red: #bf0a30;
            --white: #ffffff;
            --gray: #c7c9cb;
            --muted: #303840;
            --line: rgba(16, 24, 32, .25);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--gray);
            color: var(--ink);
            font-family: Georgia, "Times New Roman", serif;
        }
        .page {
            max-width: 980px;
            margin: 0 auto;
            padding: 64px 24px 80px;
        }
        .card {
            background: var(--white);
            border: 1px solid var(--line);
            box-shadow: 9px 9px 0 var(--red);
            padding: clamp(28px, 5vw, 56px);
        }
        h1 {
            margin: 0 0 18px;
            color: var(--navy);
            font-size: clamp(36px, 6vw, 64px);
            line-height: 1;
            letter-spacing: -1px;
        }
        p {
            margin: 0 0 18px;
            font-size: clamp(18px, 2vw, 24px);
            line-height: 1.5;
        }
        .tag {
            color: var(--red);
            font: 700 14px/1.2 Arial, sans-serif;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 18px;
        }
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 26px;
        }
        .button {
            display: inline-block;
            padding: 13px 19px;
            color: var(--white);
            background: var(--red);
            font: 700 13px Arial, sans-serif;
            letter-spacing: .4px;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="card">
            <div class="tag">The NFL Edge</div>
            <h1>The NFL Edge Archives</h1>
            <p>Redirecting to the archive vault.</p>
            <div class="actions">
                <a class="button" href="archives/index.html">Open the archive vault now</a>
            </div>
        </div>
    </div>
</body>
</html>
